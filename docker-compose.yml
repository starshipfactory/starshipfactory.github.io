services:
  jekyll:
    image: jekyll/jekyll
    environment:
      - JEKYLL_GITHUB_TOKEN=${JEKYLL_GITHUB_TOKEN}
    command:
      - sh
      - -c
      - bundle install && bundle exec jekyll serve --livereload --watch --incremental --host 0.0.0.0 --port 8080
    volumes:
      - type: "bind"
        source: "./"
        target: "/srv/jekyll"
      - type: "volume"
        source: "bundle_cache"
        target: "/usr/local/bundle"
    ports:
      - "8080:8080"
      - "35729:35729"

volumes:
  bundle_cache: