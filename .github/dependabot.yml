version: 2
updates:
  # npm — this is where Hugo itself comes from (hugo-extended), so these
  # updates change the Hugo version the site is built with.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      build-tooling:
        patterns: ["postcss*", "autoprefixer", "sass-embedded", "prettier"]

  # The theme is a git submodule and is actively developed. Pinning it
  # silently is how a site rots, so track it explicitly.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
