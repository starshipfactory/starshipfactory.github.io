name: Deploy to GitHub Pages

# Builds and publishes the site. Runs on the default branch only: merging
# this branch to master is what puts the new site live, and that merge is
# performed by hand.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Hugo build artefacts
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ runner.os }}-${{ hashFiles('assets/**', 'config/**') }}
          restore-keys: hugo-resources-${{ runner.os }}-

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npx hugo --gc --minify --environment production

      - name: Build search index
        run: npx -y pagefind --site public

      - name: Upload artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
